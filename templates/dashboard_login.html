{% extends "base.html" %}

{% block title %}Bot Dashboard Login{% endblock %}
{% block body_class %}login-page{% endblock %}

{% block page_styles %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login-page.css') }}" />
{% endblock %}

{% block content %}
  <form class="login-card" method="post" action="{{ url_for('dashboard.login') }}">
    <h2>Dashboard Login</h2>
    <p>กรอกรหัสผ่านเพื่อเข้า Dashboard</p>
    <input type="password" name="password" placeholder="Password" required />
    <button type="submit">Login</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
{% endblock %}
